<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Search - Secure DOM Manipulation</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    h2 {
      margin-bottom: 16px;
    }
    #searchInput {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    #searchInput:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    #resultList {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .item-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-title {
      font-weight: 600;
      font-size: 15px;
    }
    .item-category {
      font-size: 13px;
      background: #e2e8f0;
      color: #475569;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 24px;
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h2>Katalog Teknologi & Keamanan Web</h2>
  <input 
    type="text" 
    id="searchInput" 
    placeholder="Cari nama teknologi atau kategori (misal: Security, Backend)..." 
    autocomplete="off"
  />
  <ul id="resultList"></ul>

  <script>
    // Data array sumber
    const items = [
      { name: "Content Security Policy (CSP)", category: "Web Security" },
      { name: "Cross-Site Scripting Prevention", category: "Web Security" },
      { name: "PostgreSQL & PL/pgSQL", category: "Database" },
      { name: "DOM Manipulation API", category: "Frontend" },
      { name: "JSON Web Token (JWT)", category: "Authentication" },
      { name: "RESTful API Architecture", category: "Backend" },
      { name: "HTTPS & TLS Encryption", category: "Network Security" },
      { name: "Input Sanitization & Escaping", category: "Web Security" }
    ];

    const searchInput = document.getElementById("searchInput");
    const resultList = document.getElementById("resultList");

    // Fungsi render ulang DOM secara aman tanpa innerHTML
    function renderItems(filteredData, keyword = "") {
      // Membersihkan elemen anak sebelumnya tanpa innerHTML
      while (resultList.firstChild) {
        resultList.removeChild(resultList.firstChild);
      }

      // Jika hasil filter kosong
      if (filteredData.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "empty-state";
        emptyItem.textContent = `Tidak ada hasil yang cocok untuk "${keyword}".`;
        resultList.appendChild(emptyItem);
        return;
      }

      // Membuat elemen DOM baru untuk setiap item menggunakan createElement & textContent
      filteredData.forEach((item) => {
        const li = document.createElement("li");
        li.className = "item-card";

        const titleSpan = document.createElement("span");
        titleSpan.className = "item-title";
        titleSpan.textContent = item.name;

        const categorySpan = document.createElement("span");
        categorySpan.className = "item-category";
        categorySpan.textContent = item.category;

        li.appendChild(titleSpan);
        li.appendChild(categorySpan);
        resultList.appendChild(li);
      });
    }

    // Event listener real-time saat pengguna mengetik
    searchInput.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();

      const filtered = items.filter((item) => {
        return (
          item.name.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query)
        );
      });

      renderItems(filtered, event.target.value);
    });

    // Render awal seluruh data saat halaman pertama kali dimuat
    renderItems(items);
  </script>
</body>
</html>
